name: Verify addon and scan secrets

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Test addon
        run: python tests/run_tests.py
      - name: Build and validate package
        run: python tools/package.py
      - name: Install verified Gitleaks binary
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --location --silent --show-error --output gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check --strict
          mkdir gitleaks-bin
          tar -xzf gitleaks.tar.gz -C gitleaks-bin gitleaks
      - name: Scan complete Git history
        run: '"$RUNNER_TEMP/gitleaks-bin/gitleaks" git --log-opts=--all --redact=100 --no-banner --ignore-gitleaks-allow --max-decode-depth 5 .'
      - name: Scan files and release archive
        run: '"$RUNNER_TEMP/gitleaks-bin/gitleaks" dir --redact=100 --no-banner --ignore-gitleaks-allow --max-archive-depth 2 --max-decode-depth 5 .'
