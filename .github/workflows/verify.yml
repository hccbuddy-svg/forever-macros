name: Verify addon and scan secrets

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    # Fork pull requests must not run on the owner's machines.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macOS, Windows]
    runs-on: [self-hosted, "${{ matrix.os }}"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require Python 3.12
        run: python -c "import sys; sys.exit(0 if sys.version_info[:2] == (3, 12) else 'Python 3.12 is required, found ' + sys.version)"
      - name: Install test dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Test addon
        run: python tests/run_tests.py
      - name: Build and validate package
        run: python tools/package.py
      - name: Install verified Gitleaks binary (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --location --silent --show-error --output gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_darwin_arm64.tar.gz
          # b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5 from the official v8.30.1 checksums file
          echo 'b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5  gitleaks.tar.gz' | shasum -a 256 --check --strict
          mkdir gitleaks-bin
          tar -xzf gitleaks.tar.gz -C gitleaks-bin gitleaks
      - name: Install verified Gitleaks binary (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $zip = Join-Path $env:RUNNER_TEMP 'gitleaks.zip'
          $dest = Join-Path $env:RUNNER_TEMP 'gitleaks-bin'
          curl.exe --fail --location --silent --show-error --output "$zip" "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_windows_x64.zip"
          # d29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e from the official v8.30.1 checksums file
          $expected = 'd29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e'
          $actual = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "gitleaks checksum mismatch: expected $expected got $actual" }
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Expand-Archive -Path $zip -DestinationPath $dest -Force
      - name: Scan complete Git history
        if: runner.os == 'macOS'
        run: '"$RUNNER_TEMP/gitleaks-bin/gitleaks" git --log-opts=--all --redact=100 --no-banner --ignore-gitleaks-allow --max-decode-depth 5 .'
      - name: Scan complete Git history
        if: runner.os == 'Windows'
        shell: powershell
        run: '& "$env:RUNNER_TEMP\gitleaks-bin\gitleaks.exe" git --log-opts=--all --redact=100 --no-banner --ignore-gitleaks-allow --max-decode-depth 5 .'
      - name: Scan files and release archive
        if: runner.os == 'macOS'
        run: '"$RUNNER_TEMP/gitleaks-bin/gitleaks" dir --redact=100 --no-banner --ignore-gitleaks-allow --max-archive-depth 2 --max-decode-depth 5 .'
      - name: Scan files and release archive
        if: runner.os == 'Windows'
        shell: powershell
        run: '& "$env:RUNNER_TEMP\gitleaks-bin\gitleaks.exe" dir --redact=100 --no-banner --ignore-gitleaks-allow --max-archive-depth 2 --max-decode-depth 5 .'
